{% extends 'placement/base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 650px;">
    <div class="card shadow-lg border-0 rounded-4 p-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">🎯 Placement Eligibility Checker</h2>
            <p class="text-muted">Check if your CGPA and arrear history meet company criteria</p>
        </div>

        <form method="POST" action="{% url 'check_eligibility' %}">
            {% csrf_token %}

            <!-- Company Selection -->
            <div class="mb-3">
                <label for="company_id" class="form-label fw-semibold">Select Company</label>
                <select class="form-select form-select-lg rounded-3" id="company_id" name="company_id" required>
                    <option value="" selected disabled>-- Choose a Company --</option>
                    {% for company in companies %}
                        <option value="{{ company.id }}">{{ company.name }}</option>
                    {% empty %}
                        <option value="" disabled>No companies added yet</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Student CGPA -->
            <div class="mb-3">
                <label for="cgpa" class="form-label fw-semibold">Current CGPA</label>
                <input type="number" step="0.01" min="0.0" max="10.0" class="form-control form-control-lg rounded-3" id="cgpa" name="cgpa" placeholder="e.g. 7.8" required>
            </div>

            <!-- Active Arrears -->
            <div class="mb-3">
                <label for="active_arrears" class="form-label fw-semibold">Active (Standing) Arrears</label>
                <input type="number" min="0" class="form-control form-control-lg rounded-3" id="active_arrears" name="active_arrears" value="0" required>
            </div>

            <!-- History of Arrears -->
            <div class="mb-4">
                <label for="history_arrears" class="form-label fw-semibold">History of Arrears (Total Cleared + Active)</label>
                <input type="number" min="0" class="form-control form-control-lg rounded-3" id="history_arrears" name="history_arrears" value="0" required>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">
                    Check Eligibility Now
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
